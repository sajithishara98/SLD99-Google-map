<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sri Lanka TBM Locator</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.0/proj4.js"></script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f4f6f8; margin: 0; padding: 16px; color: #333; }
    .card { background: white; border-radius: 12px; padding: 20px; max-width: 460px; margin: 0 auto; box-shadow: 0 4px 14px rgba(0,0,0,0.1); }
    h2 { margin: 0 0 6px 0; color: #005691; text-align: center; }
    p.desc { font-size: 13px; color: #666; text-align: center; margin-bottom: 20px; }
    .form-group { margin-bottom: 12px; }
    label { display: block; font-weight: 600; font-size: 13px; margin-bottom: 4px; color: #222; }
    input, select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; }
    .btn { width: 100%; padding: 14px; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; }
    .btn-calc { background: #005691; color: white; margin-top: 10px; }
    .btn-maps { background: #1a73e8; color: white; text-decoration: none; display: block; text-align: center; margin-top: 10px; }
    .result { display: none; margin-top: 20px; padding: 15px; background: #eef6fc; border-radius: 8px; border: 1px solid #c7e2f9; }
    .result p { margin: 6px 0; font-size: 14px; }
    .highlight { font-weight: bold; color: #d32f2f; }
  </style>
</head>
<body>

  <div class="card">
    <h2>🇱🇰 TBM Finder</h2>
    <p class="desc">SLD99 & Kandawala Datum Transformation for Google Maps</p>

    <div class="form-group">
      <label for="datum">Coordinate System</label>
      <select id="datum">
        <option value="SLD99">SLD99 (EPSG:5235) — Modern Grid (~500,000)</option>
        <option value="KANDAWALA_7P">Kandawala (EPSG:5234) — 7-Param Rigorous</option>
        <option value="KANDAWALA_3P">Kandawala (EPSG:5234) — Standard 3-Param</option>
      </select>
    </div>

    <div class="form-group">
      <label for="northing">Northing (Y) [Meters]</label>
      <input type="number" id="northing" placeholder="e.g. 498320.15" step="any" inputmode="decimal" />
    </div>

    <div class="form-group">
      <label for="easting">Easting (X) [Meters]</label>
      <input type="number" id="easting" placeholder="e.g. 524110.80" step="any" inputmode="decimal" />
    </div>

    <button class="btn btn-calc" onclick="transformAndNavigate()">Calculate & Transform</button>

    <div class="result" id="resultArea">
      <p><strong>WGS84 Latitude:</strong> <span id="resLat"></span></p>
      <p><strong>WGS84 Longitude:</strong> <span id="resLon"></span></p>
      
      <a id="gmapsBtn" class="btn btn-maps" target="_blank" href="#">
        📍 Open Pin in Google Maps
      </a>

      <button class="btn" style="background:#e0e0e0; margin-top:10px;" onclick="checkProximity()">
        📐 Check Distance from my GPS
      </button>
      <p id="proximityText" style="text-align: center; margin-top: 10px;"></p>
    </div>
  </div>

  <script>
    // 1. SLD99 / EPSG:5235 with adjusted Bursa-Wolf signs for Proj4
    proj4.defs(
      "SLD99",
      "+proj=tmerc +lat_0=7.00047152777778 +lon_0=80.7717130833333 +k=0.9999238418 +x_0=500000 +y_0=500000 +ellps=evrst30 +towgs84=-0.293,766.95,87.713,0.195704,1.695068,3.473016,-0.039338 +units=m +no_defs"
    );

    // 2. Kandawala 7-Parameter (QGIS/Survey Dept derivation)
    proj4.defs(
      "KANDAWALA_7P",
      "+proj=tmerc +lat_0=7.00048027777778 +lon_0=80.7717111111111 +k=0.9999238418 +x_0=200000 +y_0=200000 +ellps=evrst30 +towgs84=-97,787,86,0.554,0.228,-0.751,-1.82 +units=m +no_defs"
    );

    // 3. Kandawala 3-Parameter standard EPSG:1157
    proj4.defs(
      "KANDAWALA_3P",
      "+proj=tmerc +lat_0=7.00048027777778 +lon_0=80.7717111111111 +k=0.9999238418 +x_0=200000 +y_0=200000 +ellps=evrst30 +towgs84=-97,787,86,0,0,0,0 +units=m +no_defs"
    );

    let calcLat = null;
    let calcLon = null;

    function transformAndNavigate() {
      const east = parseFloat(document.getElementById('easting').value);
      const north = parseFloat(document.getElementById('northing').value);
      const crs = document.getElementById('datum').value;

      if (isNaN(east) || isNaN(north)) {
        alert("Please enter both Northing and Easting coordinates.");
        return;
      }

      // Convert from local Projected CRS [X, Y] to WGS84 [Lon, Lat]
      const [lon, lat] = proj4(crs, "EPSG:4326", [east, north]);
      calcLat = lat;
      calcLon = lon;

      document.getElementById('resLat').innerText = lat.toFixed(7);
      document.getElementById('resLon').innerText = lon.toFixed(7);
      document.getElementById('gmapsBtn').href = `https://www.google.com/maps/search/?api=1&query=${lat},${lon}`;
      document.getElementById('resultArea').style.display = 'block';
      document.getElementById('proximityText').innerHTML = '';
    }

    function checkProximity() {
      if (!navigator.geolocation) return;
      const status = document.getElementById('proximityText');
      status.innerText = "Getting phone GPS location...";

      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const d = getDistanceMeters(pos.coords.latitude, pos.coords.longitude, calcLat, calcLon);
          status.innerHTML = `TBM is approx. <span class="highlight">${Math.round(d)} meters</span> from you.`;
        },
        (err) => { status.innerText = "GPS permission denied."; },
        { enableHighAccuracy: true }
      );
    }

    function getDistanceMeters(lat1, lon1, lat2, lon2) {
      const R = 6371000;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLon/2)**2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }
  </script>
</body>
</html>
